name: Daily AI Brief

on:
  schedule:
    # UTC 0:00 = 北京时间 08:00（GitHub Actions 使用 UTC）
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate & push daily AI brief (QQ)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          QQ_APP_ID: ${{ secrets.QQ_APP_ID }}
          QQ_APP_SECRET: ${{ secrets.QQ_APP_SECRET }}
          QQ_TARGET_OPENID: ${{ secrets.QQ_TARGET_OPENID }}
        run: python -m hotnews.brief --date yesterday --theme ai --push

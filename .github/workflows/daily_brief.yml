name: Daily AI Brief

on:
  schedule:
    # UTC 0:00 = 北京时间 08:00（GitHub Actions 使用 UTC）
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "目标日期（yesterday/today/YYYY-MM-DD），默认 yesterday"
        required: false
        default: "yesterday"

permissions:
  contents: write   # 允许把跨天去重状态（data/seen_brief.json）写回仓库

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate & push daily AI brief (QQ)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          QQ_APP_ID: ${{ secrets.QQ_APP_ID }}
          QQ_APP_SECRET: ${{ secrets.QQ_APP_SECRET }}
          QQ_TARGET_OPENIDS: ${{ secrets.QQ_TARGET_OPENIDS }}
        run: python -m hotnews.brief --date ${{ inputs.date || 'yesterday' }} --theme ai --days 3 --push

      - name: Persist dedup state (seen brief)
        run: |
          git config user.name "hotnews-bot"
          git config user.email "hotnews-bot@users.noreply.github.com"
          git add data/seen_brief.json
          git diff --cached --quiet || (
            git commit -m "chore: update brief dedup state"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          )
